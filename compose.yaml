# Only PostgreSQL runs in Docker. API, Dagster and Vite run on the host in Seatbelt.
name: ${COMPOSE_PROJECT_NAME:-closegraph-local}
services:
  postgres:
    image: ${CLOSEGRAPH_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-closegraph}
      POSTGRES_USER: ${POSTGRES_USER:-closegraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local_runtime.py init first}
    ports:
      - "127.0.0.1:${CLOSEGRAPH_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  postgres_data:
