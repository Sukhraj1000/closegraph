[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "closegraph-api"
version = "0.1.0"
description = "CloseGraph API runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "uvicorn==0.52.4",
  "dagster-webserver==1.13.21",

  "dagster==1.13.21",
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "pandera[polars]==0.33.1",
  "polars==1.44.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/closegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
